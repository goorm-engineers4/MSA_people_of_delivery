        -Dprofiler.transport.grpc.collector.ip=pinpoint-collector
        -Dprofiler.transport.grpc.agent.collector.port=9991
        -Dprofiler.transport.grpc.stat.collector.port=9992
        -Dprofiler.transport.grpc.span.collector.port=9993
    volumes:
      - ./pinpoint-agent:/pinpoint-agent:ro
    networks:
      - pinpoint_net
    depends_on:
      - postgres
      - redis
      - discovery
      - module-common

  store-service:
